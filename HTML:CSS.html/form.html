<h1><u>Introduction Form </u></h1>
<body>
    <form>
       <table>
        <tr>
            <td class="myclass">Name</td>
            <td><input type="text" placeholder="Nishant"> </td>

        <tr>
            <td class="myclass">Password</td>
            <td><input type="password" name="password"></td>
        </tr>
        <tr>

        <tr>

        <tr>
            <td class="myclass">upload image </td>

        </tr>
        <tr>
            <td>
             <input type="submit" value="submit form">

            </td>
